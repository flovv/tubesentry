[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tubesentry"
version = "0.1.0"
description = "Local-First YouTube & Performance Max Placement Waste Auditor & MCP Server"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "TubeSentry Core Team" }
]
requires-python = ">=3.10"
keywords = [
    "youtube-ads",
    "google-ads",
    "dv360",
    "performance-max",
    "placement-exclusions",
    "made-for-kids",
    "mcp-server",
    "model-context-protocol",
    "claude-desktop"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=14.0.0",
    "pydantic>=2.5.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
    "mcp>=1.2.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
]

[project.scripts]
tubesentry = "tubesentry.cli:app"
tubesentry-mcp = "tubesentry.mcp_server:main"

[project.urls]
Homepage = "https://tubesentry.dev"
Documentation = "https://tubesentry.dev/docs"
Repository = "https://github.com/flovv/tubesentry"
Changelog = "https://github.com/flovv/tubesentry/releases"

[tool.hatch.build.targets.wheel]
packages = ["tubesentry"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["B008", "S110", "BLE001"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "silent"
